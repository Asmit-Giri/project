services:
  - type: web
    name: agrisuraksha-farmers-alert
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 4 wsgi:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_ENV
        value: production
      - key: MYSQL_HOST
        value: 127.0.0.1
      - key: MYSQL_PORT
        value: 3306

